name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java (for Flutter)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false

    - name: Install dependencies
      run: flutter pub get

    - name: Generate & Configure Podfile for iOS 14.0
      run: |
        cd ios
        # Примусово генеруємо Podfile через flutter build або створюємо мінімальний
        flutter build ios --config-only --no-codesign
        
        # Налаштовуємо платформу iOS 14.0 у Podfile
        if [ -f Podfile ]; then
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '14.0'/g" Podfile
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" Podfile
        fi
        
        pod repo update
        pod install --repo-update

    - name: Build iOS (No codesign)
      run: flutter build ios --release --no-codesign

    - name: Compress iOS payload
      run: |
        cd build/ios/iphoneos
        mkdir Payload
        mv Runner.app Payload/
        zip -r CardSwap.ipa Payload

    - name: Upload iOS IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: build/ios/iphoneos/CardSwap.ipa
